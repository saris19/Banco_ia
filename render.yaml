# Render Blueprint: API (FastAPI) + PostgreSQL database.
# Render → New → Blueprint → select this repository.
services:
  - type: web
    name: banco-proyectos-grado-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: banco-proyectos-grado-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: SEED_DEMO_DATA
        value: "1"

databases:
  - name: banco-proyectos-grado-db
    plan: free
    databaseName: thesis_bank
